<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | JSW SEED Monthly tracking Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page" data-page="login">

  <div class="login-card">
    <div class="login-head">
      <img src="assets/jsw-logo.png" alt="JSW" id="logo"
           onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
      <div class="logo-fallback" id="logoFallback">JSW</div>
      <h1>JSW SEED Monthly tracking Dashboard</h1>
      <p>Sustainability · Energy · Environment &amp; Decarbonization</p>
    </div>
    <div class="login-bar"></div>

    <form class="login" id="loginForm" autocomplete="on" novalidate>
      <div class="login-error" id="loginError" role="alert"></div>

      <div class="field">
        <label for="email">Email ID</label>
        <input type="email" id="email" name="email" placeholder="name@jsw.in" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" id="togglePw" aria-label="Show or hide password">Show</button>
        </div>
      </div>

      <div class="row">
        <label><input type="checkbox" id="remember"> Keep me signed in</label>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
    </form>

    <div class="login-foot">Authorised JSW users only</div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
